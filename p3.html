<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Pemrosesan Citra & Geometri Lanjutan</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #090d16;
            --card-bg: #111827;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
            --border: rgba(99, 102, 241, 0.3);
            --accent: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at top, #1e1b4b, #090d16);
            color: var(--text);
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 980px;
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.85), rgba(15, 23, 42, 0.95));
            border: 2px solid transparent;
            border-image: linear-gradient(to bottom right, #6366f1, #38bdf8, #10b981) 1;
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.7), 0 0 25px rgba(99, 102, 241, 0.2);
            backdrop-filter: blur(10px);
        }

        h1 {
            text-align: center;
            background: linear-gradient(to right, #818cf8, #38bdf8, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            font-size: 2rem;
            font-weight: 800;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 24px;
            font-size: 0.95rem;
        }

        .input-controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        input[type="file"] {
            display: none;
        }

        .btn {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }

        .btn:hover {
            background: linear-gradient(135deg, #4f46e5, #4338ca);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.6);
        }

        .btn-outline {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text);
            box-shadow: none;
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #6366f1;
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }

        .btn-success:hover {
            background: linear-gradient(135deg, #059669, #047857);
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.6);
        }

        .preview-area {
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #030712, #0f172a);
            border: 2px dashed var(--border);
            border-radius: 14px;
            min-height: 350px;
            margin-bottom: 20px;
            overflow: auto;
            position: relative;
            padding: 15px;
        }

        canvas {
            max-width: 100%;
            max-height: 480px;
            display: block;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }

        .section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #38bdf8;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .control-group {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .filter-grid, .geo-grid {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-btn, .action-btn {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .filter-btn:hover, .filter-btn.active {
            color: white;
            border-color: #6366f1;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .action-btn:hover {
            color: white;
            border-color: #38bdf8;
            background: #1e40af;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .slider-container input[type="range"] {
            cursor: pointer;
            accent-color: #6366f1;
        }

        .bottom-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border);
            padding-top: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .status {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        video {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Pemrosesan Citra & Geometri Lanjutan</h1>
        <p class="subtitle">Filter Warna, Bokeh, Morfologi, Noise, Border, & Transformasi Geometri</p>

        <!-- Tombol Sumber Input -->
        <div class="input-controls">
            <label for="imageLoader" class="btn">
                📁 Pilih Gambar
            </label>
            <input type="file" id="imageLoader" accept="image/*">

            <button class="btn btn-outline" id="webcamBtn" onclick="toggleWebcam()">
                📷 Buka Kamera Web
            </button>
        </div>

        <!-- Area Tampilan Canvas -->
        <div class="preview-area">
            <canvas id="outputCanvas"></canvas>
            <video id="videoElement" autoplay playsinline></video>
        </div>

        <!-- Panel Filter Citra & Efek -->
        <div class="control-group">
            <div class="section-title">Filter Warna, Efek & Morfologi</div>
            <div class="filter-grid">
                <button class="filter-btn active" onclick="setFilter('normal', this)">Normal</button>
                <button class="filter-btn" onclick="setFilter('grayscale', this)">Grayscale</button>
                <button class="filter-btn" onclick="setFilter('binary', this)">Black & White</button>
                <button class="filter-btn" onclick="setFilter('sepia', this)">Sepia</button>
                <button class="filter-btn" onclick="setFilter('invert', this)">Invert</button>
                <button class="filter-btn" onclick="setFilter('edge', this)">Deteksi Tepi</button>
                <button class="filter-btn" onclick="setFilter('bokeh', this)">✨ Bokeh</button>
                <button class="filter-btn" onclick="setFilter('noise', this)">📺 Noise (Derau)</button>
                <button class="filter-btn" onclick="setFilter('dilation', this)">📈 Dilasi (Morfologi)</button>
                <button class="filter-btn" onclick="setFilter('erosion', this)">📉 Erosi (Morfologi)</button>
                <button class="filter-btn" onclick="setFilter('border', this)">🖼️ Bingkai (Border)</button>
            </div>
        </div>

        <!-- Panel Operasi Geometri -->
        <div class="control-group">
            <div class="section-title">Operasi Geometri Lanjutan</div>
            <div class="geo-grid" style="margin-bottom: 12px;">
                <button class="action-btn" onclick="applyFlip('H')">↔️ Flip Horizontal</button>
                <button class="action-btn" onclick="applyFlip('V')">↕️ Flip Vertikal</button>
                <button class="action-btn" onclick="resetGeometry()">↺ Reset Geometri</button>
            </div>
            <div class="geo-grid" style="gap: 20px;">
                <div class="slider-container">
                    <label>Resize Scale:</label>
                    <input type="range" id="resizeRange" min="0.25" max="2.0" step="0.25" value="1.0" oninput="updateResize(this.value)">
                    <span id="resizeVal">100%</span>
                </div>
                <div class="slider-container">
                    <label>Rotate:</label>
                    <input type="range" id="rotateRange" min="-180" max="180" step="5" value="0" oninput="updateRotate(this.value)">
                    <span id="rotateVal">0°</span>
                </div>
                <div class="slider-container">
                    <label>Warp Affine (Shear):</label>
                    <input type="range" id="warpRange" min="-0.5" max="0.5" step="0.1" value="0.0" oninput="updateWarp(this.value)">
                    <span id="warpVal">0.0</span>
                </div>
            </div>
        </div>

        <!-- Bagian Bawah & Tombol Unduh -->
        <div class="bottom-actions">
            <span class="status" id="statusText">Mode: Pilih gambar atau buka kamera.</span>
            <button class="btn btn-success" onclick="downloadImage()">
                💾 Unduh Hasil
            </button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('outputCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const video = document.getElementById('videoElement');
        const imageLoader = document.getElementById('imageLoader');
        const statusText = document.getElementById('statusText');

        let currentMode = 'none'; 
        let currentFilter = 'normal';
        let stream = null;
        let loadedImage = null;
        let animationFrameId = null;

        let scaleFactor = 1.0;
        let rotateAngle = 0;        
        let warpShear = 0.0;        
        let flipH = false;
        let flipV = false;

        let baseWidth = 600;
        let baseHeight = 400;

        canvas.width = baseWidth;
        canvas.height = baseHeight;
        drawPlaceholder();

        function drawPlaceholder() {
            ctx.fillStyle = '#111827';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#94a3b8';
            ctx.font = '16px Segoe UI, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('Silakan unggah gambar atau aktifkan kamera web', canvas.width / 2, canvas.height / 2);
        }

        imageLoader.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            stopWebcam();
            currentMode = 'image';

            const reader = new FileReader();
            reader.onload = function(event) {
                loadedImage = new Image();
                loadedImage.onload = function() {
                    baseWidth = loadedImage.width;
                    baseHeight = loadedImage.height;

                    const maxW = 800;
                    if (baseWidth > maxW) {
                        baseHeight = (maxW / baseWidth) * baseHeight;
                        baseWidth = maxW;
                    }

                    resetGeoValues();
                    updateCanvasDimensions();
                    statusText.innerText = `Mode: Gambar (${loadedImage.width}x${loadedImage.height}px)`;
                    processImage();
                };
                loadedImage.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        async function toggleWebcam() {
            if (currentMode === 'webcam') {
                stopWebcam();
                statusText.innerText = "Kamera dihentikan.";
                drawPlaceholder();
            } else {
                try {
                    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                        throw new Error("Browser Anda tidak mendukung akses kamera atau tidak menggunakan koneksi HTTPS.");
                    }

                    stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { width: { ideal: 1280 }, height: { ideal: 720 } } 
                    });
                    video.srcObject = stream;
                    currentMode = 'webcam';
                    document.getElementById('webcamBtn').innerText = "🛑 Hentikan Kamera";
                    statusText.innerText = "Mode: Kamera Web Real-Time";

                    video.onloadedmetadata = () => {
                        baseWidth = video.videoWidth || 640;
                        baseHeight = video.videoHeight || 480;
                        resetGeoValues();
                        updateCanvasDimensions();
                        renderLoop();
                    };
                } catch (err) {
                    alert("Gagal mengakses kamera: " + err.message + "\nPastikan Anda mengakses halaman ini melalui HTTPS dan telah memberikan izin akses.");
                    currentMode = 'none';
                }
            }
        }

        function stopWebcam() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }
            document.getElementById('webcamBtn').innerText = "📷 Buka Kamera Web";
            if (currentMode === 'webcam') {
                currentMode = 'none';
            }
        }

        function resetGeoValues() {
            scaleFactor = 1.0;
            rotateAngle = 0;
            warpShear = 0.0;
            flipH = false;
            flipV = false;
            document.getElementById('resizeRange').value = 1.0;
            document.getElementById('resizeVal').innerText = "100%";
            document.getElementById('rotateRange').value = 0;
            document.getElementById('rotateVal').innerText = "0°";
            document.getElementById('warpRange').value = 0.0;
            document.getElementById('warpVal').innerText = "0.0";
        }

        function updateCanvasDimensions() {
            canvas.width = Math.round(baseWidth * scaleFactor);
            canvas.height = Math.round(baseHeight * scaleFactor);
        }

        function renderLoop() {
            if (currentMode === 'webcam') {
                drawImageWithGeometry(video);
                applyFilterToCanvas();
                animationFrameId = requestAnimationFrame(renderLoop);
            }
        }

        function processImage() {
            if (currentMode === 'image' && loadedImage) {
                drawImageWithGeometry(loadedImage);
                applyFilterToCanvas();
            }
        }

        function setFilter(filterType, elem) {
            currentFilter = filterType;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            elem.classList.add('active');

            if (currentMode === 'image') {
                processImage();
            }
        }

        function updateResize(val) {
            scaleFactor = parseFloat(val);
            document.getElementById('resizeVal').innerText = Math.round(scaleFactor * 100) + '%';
            updateCanvasDimensions();
            if (currentMode === 'image') processImage();
        }

        function updateRotate(val) {
            rotateAngle = parseInt(val);
            document.getElementById('rotateVal').innerText = rotateAngle + '°';
            if (currentMode === 'image') processImage();
        }

        function updateWarp(val) {
            warpShear = parseFloat(val);
            document.getElementById('warpVal').innerText = warpShear.toFixed(1);
            if (currentMode === 'image') processImage();
        }

        function applyFlip(type) {
            if (currentMode === 'none') {
                alert("Harap masukkan gambar atau aktifkan kamera terlebih dahulu.");
                return;
            }
            if (type === 'H') flipH = !flipH;
            if (type === 'V') flipV = !flipV;
            if (currentMode === 'image') processImage();
        }

        function resetGeometry() {
            resetGeoValues();
            updateCanvasDimensions();
            if (currentMode === 'image') processImage();
        }

        function drawImageWithGeometry(source) {
            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const w = canvas.width;
            const h = canvas.height;

            ctx.translate(w / 2, h / 2);
            ctx.rotate((rotateAngle * Math.PI) / 180);
            ctx.transform(1, 0, warpShear, 1, 0, 0);

            let scaleX = flipH ? -1 : 1;
            let scaleY = flipV ? -1 : 1;
            ctx.scale(scaleX, scaleY);

            ctx.drawImage(source, -w / 2, -h / 2, w, h);
            ctx.restore();
        }

        function applyFilterToCanvas() {
            if (currentFilter === 'normal') return;

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            const w = canvas.width;
            const h = canvas.height;

            if (currentFilter === 'grayscale') {
                for (let i = 0; i < data.length; i += 4) {
                    let avg = 0.3 * data[i] + 0.59 * data[i + 1] + 0.11 * data[i + 2];
                    data[i] = avg; data[i + 1] = avg; data[i + 2] = avg;
                }
            } else if (currentFilter === 'binary') {
                for (let i = 0; i < data.length; i += 4) {
                    let avg = 0.3 * data[i] + 0.59 * data[i + 1] + 0.11 * data[i + 2];
                    let val = avg >= 128 ? 255 : 0;
                    data[i] = val; data[i + 1] = val; data[i + 2] = val;
                }
            } else if (currentFilter === 'sepia') {
                for (let i = 0; i < data.length; i += 4) {
                    let r = data[i], g = data[i + 1], b = data[i + 2];
                    data[i] = Math.min(255, (r * 0.393) + (g * 0.769) + (b * 0.189));
                    data[i + 1] = Math.min(255, (r * 0.349) + (g * 0.686) + (b * 0.168));
                    data[i + 2] = Math.min(255, (r * 0.272) + (g * 0.534) + (b * 0.131));
                }
            } else if (currentFilter === 'invert') {
                for (let i = 0; i < data.length; i += 4) {
                    data[i] = 255 - data[i];
                    data[i + 1] = 255 - data[i + 1];
                    data[i + 2] = 255 - data[i + 2];
                }
            } else if (currentFilter === 'edge') {
                const copy = new Uint8ClampedArray(data);
                for (let y = 1; y < h - 1; y++) {
                    for (let x = 1; x < w - 1; x++) {
                        let idx = (y * w + x) * 4;
                        let leftIdx = (y * w + (x - 1)) * 4;
                        let rightIdx = (y * w + (x + 1)) * 4;
                        let rDiff = Math.abs(copy[rightIdx] - copy[leftIdx]);
                        let gDiff = Math.abs(copy[rightIdx + 1] - copy[leftIdx + 1]);
                        let bDiff = Math.abs(copy[rightIdx + 2] - copy[leftIdx + 2]);
                        let edgeVal = (rDiff + gDiff + bDiff) / 3;
                        data[idx] = edgeVal;
                        data[idx + 1] = edgeVal;
                        data[idx + 2] = edgeVal;
                    }
                }
            } else if (currentFilter === 'bokeh') {
                const copy = new Uint8ClampedArray(data);
                let radius = 2;
                for (let y = radius; y < h - radius; y += radius) {
                    for (let x = radius; x < w - radius; x += radius) {
                        let idx = (y * w + x) * 4;
                        data[idx] = copy[idx];
                        data[idx+1] = copy[idx+1];
                        data[idx+2] = copy[idx+2];
                    }
                }
            } else if (currentFilter === 'noise') {
                for (let i = 0; i < data.length; i += 4) {
                    let noise = (Math.random() - 0.5) * 60;
                    data[i] = Math.min(255, Math.max(0, data[i] + noise));
                    data[i + 1] = Math.min(255, Math.max(0, data[i + 1] + noise));
                    data[i + 2] = Math.min(255, Math.max(0, data[i + 2] + noise));
                }
            } else if (currentFilter === 'dilation') {
                // Morfologi Dilasi (3x3 Max Filter)
                const copy = new Uint8ClampedArray(data);
                for (let y = 1; y < h - 1; y++) {
                    for (let x = 1; x < w - 1; x++) {
                        let idx = (y * w + x) * 4;
                        let maxR = 0, maxG = 0, maxB = 0;
                        for (let ky = -1; ky <= 1; ky++) {
                            for (let kx = -1; kx <= 1; kx++) {
                                let nIdx = ((y + ky) * w + (x + kx)) * 4;
                                if (copy[nIdx] >
